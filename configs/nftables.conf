#!/usr/sbin/nft -f
# /etc/nftables.conf
# Generated by VPN Gateway Setup Wizard

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy accept;
        iif "lo" accept
        ct state established,related accept
        
        # Allow DHCP, DNS, and Web UI on Wi-Fi LAN
        iif "wlp4s0" udp dport { 53, 67 } accept
        iif "wlp4s0" tcp dport { 53, 80 } accept
    }

    chain forward {
        type filter hook forward priority filter; policy accept;
        ct state established,related accept
        
        # Forward Wi-Fi client traffic to xray0 TUN
        iif "wlp4s0" oif "xray0" accept
        
        # Fallback forward to WAN Ethernet
        iif "wlp4s0" oif "enp3s0" accept
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}

table ip nat {
    chain postrouting {
        type filter hook postrouting priority srcnat; policy accept;
        
        # Masquerade traffic going to Xray TUN
        oif "xray0" masquerade
        
        # Masquerade traffic going direct to WAN
        oif "enp3s0" masquerade
    }
}
