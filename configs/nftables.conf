#!/usr/sbin/nft -f
# /etc/nftables.conf
# Generated by VPN Gateway Setup Wizard

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy accept;
        iifname "lo" accept
        ct state established,related accept
        
        # Allow DHCP, DNS, and Web UI on Wi-Fi LAN
        iifname "wlp4s0" udp dport { 53, 67 } accept
        iifname "wlp4s0" tcp dport { 53, 80 } accept
        ip saddr 10.42.0.0/24 udp dport { 53, 67 } accept
        ip saddr 10.42.0.0/24 tcp dport { 53, 80 } accept
    }

    chain forward {
        type filter hook forward priority filter; policy accept;
        ct state established,related accept
        
        # Forward Wi-Fi client traffic to xray0 TUN and return traffic
        iifname "wlp4s0" oifname "xray0" accept
        iifname "xray0" oifname "wlp4s0" accept
        
        # Fallback forward to WAN Ethernet
        iifname "wlp4s0" oifname "enp3s0" accept
        iifname "enp3s0" oifname "wlp4s0" accept

        # Forward all Wi-Fi subnet client traffic
        ip saddr 10.42.0.0/24 accept
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}

table ip nat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        
        # Only masquerade traffic exiting directly via physical WAN
        oifname "enp3s0" masquerade
    }
}
