# /etc/hostapd/hostapd.conf
# Managed by VPN Gateway
interface=wlp4s0
driver=nl80211
ssid=freedom
hw_mode=g
channel=6
ieee80211n=1
wmm_enabled=1
ht_capab=[HT20][SHORT-GI-20]
macaddr_acl=0
auth_algs=1
ignore_broadcast_ssid=0
wpa=2
wpa_passphrase=freedom123
wpa_key_mgmt=WPA-PSK
wpa_pairwise=TKIP
rsn_pairwise=CCMP
